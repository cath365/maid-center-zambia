name: Firebase production check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.25.0 --activate
          pnpm --version

      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit lockfile when changed
        id: lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "Update pnpm lockfile for Firebase"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Production build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyB5cGcdOKQDCGfBwgqPjz1lRul2ba-lJPY"
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "maid-center-zambia.firebaseapp.com"
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: "maid-center-zambia"
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "maid-center-zambia.firebasestorage.app"
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "870188151806"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:870188151806:web:f3032852782ae4897d46af"
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: "G-JQZ1ZS7K1F"
        run: pnpm build
